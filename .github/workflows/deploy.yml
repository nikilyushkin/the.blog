# .github/workflows/deploy.yml
name: Deploy heynik.blog

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push ARM64 Image
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build & push ARM64 image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.actor }}/blog:latest
            ghcr.io/${{ github.actor }}/blog:${{ github.sha }}

  deploy:
    name: Bump image tag in GitOps repo
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    # Деплой идёт через ArgoCD: раскатывает он, а не CI. Задача этого шага —
    # записать новый тег образа в манифест, остальное сделает кластер.
    # Раньше здесь были rsync и ssh на виртуалку — её больше нет.
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nikilyushkin/homelab-k8s
          ssh-key: ${{ secrets.GITOPS_SSH_KEY }}
          ref: main

      - name: Bump image tag
        run: |
          set -euo pipefail
          f=manifests/blog/base/kustomization.yaml
          old=$(grep -A1 'name: ghcr.io/nikilyushkin/blog' "$f" | grep newTag | awk '{print $2}')
          if [ "$old" = "$GITHUB_SHA" ]; then
            echo "Тег уже $GITHUB_SHA, коммитить нечего"
            exit 0
          fi
          sed -i "s|newTag: .*|newTag: $GITHUB_SHA|" "$f"
          echo "  $old -> $GITHUB_SHA"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(blog): образ $(echo $GITHUB_SHA | cut -c1-12)"
          git push origin main

      - name: Summary
        run: |
          echo "Образ: ghcr.io/${{ github.actor }}/blog:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Тег записан в homelab-k8s, ArgoCD раскатает сам." >> $GITHUB_STEP_SUMMARY
